<!DOCTYPE html>
<html>

<head>
    <title>Debug</title>
    <script>
        window.onerror = function (message, source, lineno, colno, error) {
            fetch('http://localhost/client/app/Aplikasi-kelola-keuangan-pribadi/api/log_error.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, source, lineno, colno, stack: error ? error.stack : '' })
            });
        };
    </script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/transactions.js"></script>
    <script src="js/categories.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/settings.js"></script>
</head>

<body>
    <script>
        fetch('http://localhost/client/app/Aplikasi-kelola-keuangan-pribadi/api/log_error.php', {
            method: 'POST',
            body: JSON.stringify({ message: 'No syntax errors found, scripts loaded successfully.' })
        });
    </script>
</body>

</html>
